# Dependabot version updates: one grouped pull request per ecosystem a week.
# Security updates are switched on in the repository settings.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/src/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "nuget"
    directories:
      - "/src/apps/Ivy.Open.Raise"
      - "/src/apps/Ivy.Open.Raise.Deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/src/apps/Ivy.Open.Raise.Deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
